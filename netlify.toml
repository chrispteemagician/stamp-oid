[build]
  command = "npm install @google/generative-ai"
  functions = "netlify/functions"
  publish = "."

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_API_KEY"

[[redirects]]
  from = "/*"
  to = "https://feelfamous.co.uk/stamp"
  status = 301
  force = true

[functions]
  node_bundler = "esbuild"